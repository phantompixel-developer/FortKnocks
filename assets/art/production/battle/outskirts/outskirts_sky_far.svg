<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="930" viewBox="0 0 2160 930">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2e5872"/>
    <stop offset=".26" stop-color="#4f7081"/>
    <stop offset=".50" stop-color="#9b675d"/>
    <stop offset=".72" stop-color="#e07d49"/>
    <stop offset="1" stop-color="#aa6445"/>
  </linearGradient>
  <radialGradient id="sun" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff2ba"/>
    <stop offset=".34" stop-color="#ffd176" stop-opacity=".98"/>
    <stop offset=".68" stop-color="#ef9650" stop-opacity=".46"/>
    <stop offset="1" stop-color="#e17643" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="haze" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f0a96b" stop-opacity=".05"/>
    <stop offset=".52" stop-color="#f8d5aa" stop-opacity=".34"/>
    <stop offset="1" stop-color="#e7834d" stop-opacity=".05"/>
  </linearGradient>
</defs>
<rect width="2160" height="930" fill="url(#sky)"/>
<circle cx="1770" cy="205" r="214" fill="url(#sun)"/>
<circle cx="1770" cy="205" r="56" fill="#ffe09a" opacity=".94"/>

