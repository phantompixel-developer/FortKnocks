<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="930" viewBox="0 0 2160 930">
<defs>
 <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#a39b88"/>
  <stop offset=".28" stop-color="#777a70"/>
  <stop offset=".64" stop-color="#505b58"/>
  <stop offset="1" stop-color="#303b3b"/>
 </linearGradient>
 <linearGradient id="underside" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#39484b"/>
  <stop offset="1" stop-color="#17242a"/>
 </linearGradient>
 <linearGradient id="warmFace" x1="0" y1="0" x2="1" y2=".2">
  <stop offset="0" stop-color="#f2aa68" stop-opacity=".62"/>
  <stop offset=".5" stop-color="#d98152" stop-opacity=".22"/>
  <stop offset="1" stop-color="#b76245" stop-opacity=".02"/>
 </linearGradient>
 <linearGradient id="shed" x1="0" y1="0" x2="1" y2=".25">
  <stop offset="0" stop-color="#756858"/>
  <stop offset=".54" stop-color="#4f5a57"/>
  <stop offset="1" stop-color="#2d393b"/>
 </linearGradient>
</defs>

<!-- Signature Roadblock Trial location: an abandoned Outskirts checkpoint beneath a failed flyover.
     Everything here is decorative. The live roadblock, cover, player, enemy and power cell remain separate nodes. -->

<!-- broken flyover provides the same strong silhouette language as the approved preview -->
<g stroke="#142026" stroke-linejoin="round">
 <path d="M-90 382 H1370 L1462 420 L1422 516 H-90Z" fill="url(#concrete)" stroke-width="10"/>
 <path d="M-90 498 H1418 L1388 556 H-90Z" fill="url(#underside)" stroke-width="8"/>
 <path d="M1532 420 H2220 V512 H1494Z" fill="url(#concrete)" stroke-width="10"/>
 <path d="M1494 508 H2220 V558 H1470Z" fill="url(#underside)" stroke-width="8"/>
</g>

<!-- sun-facing top planes -->
<path d="M-90 382 H1370 L1410 398 H-90Z" fill="url(#warmFace)"/>
<path d="M1532 420 H2220 V442 H1510Z" fill="url(#warmFace)"/>

<!-- failed span / exposed reinforcement -->
<path d="M1370 382 L1426 418 L1402 452 L1454 474 L1420 516" fill="none" stroke="#2b3534" stroke-width="16"/>
<path d="M1532 420 L1492 444 L1514 468 L1478 506" fill="none" stroke="#2b3534" stroke-width="15"/>
