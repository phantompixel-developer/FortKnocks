 <path d="M1770 508 H1818 L1810 900 H1790Z"/>
</g>
<g stroke="#a85f45" stroke-width="5" opacity=".55">
 <path d="M432 548 V724 M1210 542 V710 M1848 550 V714"/>
</g>

<!-- player-side salvage scaffold / roadside workshop shell -->
