<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="350" viewBox="0 0 2160 350">
<defs>
 <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#55524a"/>
  <stop offset=".24" stop-color="#403f3b"/>
  <stop offset=".62" stop-color="#2d3031"/>
  <stop offset="1" stop-color="#202529"/>
 </linearGradient>
 <linearGradient id="sunwash" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#eaa065" stop-opacity=".05"/>
  <stop offset=".72" stop-color="#f3b46f" stop-opacity=".15"/>
  <stop offset="1" stop-color="#d77b4d" stop-opacity=".04"/>
 </linearGradient>
</defs>
<rect width="2160" height="350" fill="url(#road)"/>
<rect width="2160" height="68" fill="url(#sunwash)"/>

