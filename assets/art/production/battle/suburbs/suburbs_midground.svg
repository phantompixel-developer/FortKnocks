<g stroke="#222d31" stroke-width="8" fill="none"><path d="M858 858 V706 M1064 858 V706 M842 712 H1082"/></g>
<rect x="892" y="734" width="138" height="88" fill="#536965" opacity=".43" stroke="#243033" stroke-width="5"/>
