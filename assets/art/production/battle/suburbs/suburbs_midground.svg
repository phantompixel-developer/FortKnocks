 <rect x="1988" y="652" width="44" height="84"/><rect x="2080" y="616" width="56" height="44"/>
</g>
<!-- boarded / cracked openings and faded render add material breakup -->
<g stroke="#79634d" stroke-width="7" opacity=".68"><path d="M144 642 L202 612 M616 632 L678 602 M1350 650 L1404 622 M1842 648 L1894 618"/></g>
<g fill="#48534f" opacity=".55"><path d="M318 594 H430 V616 H318Z"/><path d="M1002 584 H1168 V606 H1002Z"/><path d="M1738 604 H1910 V626 H1738Z"/></g>
<g stroke="#292f2f" stroke-width="3" opacity=".52"><path d="M220 612 V720 M694 588 V724 M1182 602 V722 M1668 596 V724 M2130 596 V720"/></g>
