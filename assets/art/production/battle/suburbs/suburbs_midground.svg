<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="930" viewBox="0 0 2160 930">
<defs>
 <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d5c50"/><stop offset=".6" stop-color="#544942"/><stop offset="1" stop-color="#403a38"/></linearGradient>
 <linearGradient id="render" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#68726c"/><stop offset=".58" stop-color="#515d58"/><stop offset="1" stop-color="#3c4845"/></linearGradient>
 <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#536762"/><stop offset="1" stop-color="#354441"/></linearGradient>
</defs>
<!-- Residential edge uses mixed footprints, roof pitches and setbacks instead of one repeated house module. -->
<g stroke="#182226" stroke-width="7" stroke-linejoin="round">
 <path d="M10 736 V604 L106 530 232 592 252 736Z" fill="url(#brick)"/>
 <path d="M254 736 V626 L300 586 H452 V736Z" fill="#56615c"/>
 <path d="M476 736 V576 L590 500 720 578 V736Z" fill="url(#render)"/>
 <path d="M746 736 V632 L820 566 946 610 946 736Z" fill="#62564c"/>
 <path d="M970 736 V572 L1062 514 1142 542 1204 594 V736Z" fill="url(#cool)"/>
 <path d="M1228 736 V612 L1300 550 1432 604 V736Z" fill="url(#brick)"/>
 <path d="M1456 736 V588 L1548 520 1690 582 V736Z" fill="url(#render)"/>
 <path d="M1718 736 V630 L1780 574 H1926 V736Z" fill="#555f5a"/>
 <path d="M1950 736 V596 L2052 526 2160 590 V736Z" fill="url(#brick)"/>
</g>
<!-- Chimneys, patched roofs and missing gutters break the roofline. -->
