 <rect x="58" y="660" width="46" height="76"/><rect x="142" y="626" width="60" height="46"/>
 <rect x="286" y="664" width="42" height="72"/><rect x="360" y="620" width="58" height="44"/>
 <rect x="520" y="650" width="46" height="86"/><rect x="616" y="610" width="62" height="48"/>
 <rect x="784" y="666" width="44" height="70"/><rect x="860" y="634" width="52" height="40"/>
 <rect x="1014" y="646" width="48" height="90"/><rect x="1104" y="606" width="54" height="44"/>
 <rect x="1268" y="660" width="42" height="76"/><rect x="1352" y="628" width="50" height="42"/>
 <rect x="1502" y="650" width="46" height="86"/><rect x="1600" y="614" width="58" height="46"/>
