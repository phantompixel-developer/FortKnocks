<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8a664d"/>
    <stop offset=".50" stop-color="#675344"/>
    <stop offset="1" stop-color="#3d4944"/>
  </linearGradient>
  <linearGradient id="repair" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#66716a"/>
    <stop offset="1" stop-color="#34413e"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8cb0aa"/>
    <stop offset=".5" stop-color="#4d7070"/>
    <stop offset="1" stop-color="#263d41"/>
  </linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f0ad63" stop-opacity="0"/>
    <stop offset=".52" stop-color="#f0ad63" stop-opacity=".52"/>
    <stop offset="1" stop-color="#f0ad63" stop-opacity="0"/>
  </linearGradient>
</defs>

