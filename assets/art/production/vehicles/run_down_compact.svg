<svg xmlns="http://www.w3.org/2000/svg" width="512" height="256" viewBox="0 0 512 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a664c"/>
      <stop offset="0.52" stop-color="#76503e"/>
      <stop offset="1" stop-color="#4c372f"/>
    </linearGradient>
    <linearGradient id="repair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58625d"/>
      <stop offset="1" stop-color="#323a37"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#799b9d"/>
      <stop offset="0.48" stop-color="#46666a"/>
      <stop offset="1" stop-color="#273c40"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1b067" stop-opacity=".0"/>
      <stop offset=".45" stop-color="#f1b067" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f1b067" stop-opacity=".0"/>
    </linearGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="256" cy="219" rx="202" ry="18" fill="#080c0f" opacity=".55"/>

  <!-- rear bumper / underbody -->
  <path d="M49 158 L79 148 L431 148 L460 165 L452 195 L61 195 Z"
        fill="#12191d" stroke="#090d10" stroke-width="8" stroke-linejoin="round"/>
  <rect x="50" y="171" width="29" height="16" rx="3" fill="#465057" stroke="#0b1013" stroke-width="5"/>
  <rect x="438" y="169" width="25" height="16" rx="3" fill="#6e543f" stroke="#0b1013" stroke-width="5"/>

  <!-- main civilian shell -->
  <path d="M70 113 L113 105 L150 61 L259 53 L321 96 L410 103 L448 127 L442 174 L72 174 Z"
        fill="url(#body)" stroke="#0b1114" stroke-width="9" stroke-linejoin="round"/>

  <!-- dented hood and rear hatch planes -->
  <path d="M320 99 L403 105 L441 128 L426 145 L325 143 Z"
        fill="#6e4938" stroke="#1a2021" stroke-width="4"/>
  <path d="M75 117 L116 108 L143 126 L132 154 L75 157 Z"
        fill="#865b42" stroke="#1a2021" stroke-width="4"/>

  <!-- cabin frame -->
  <path d="M151 61 L258 53 L319 96 L139 96 Z"
        fill="#1a2326" stroke="#0b1114" stroke-width="8" stroke-linejoin="round"/>

  <!-- windows -->
  <path d="M164 66 L215 62 L215 91 L145 91 Z"
        fill="url(#glass)" stroke="#11191c" stroke-width="4"/>
  <path d="M224 61 L253 59 L299 91 L224 91 Z"
        fill="url(#glass)" stroke="#11191c" stroke-width="4"/>
  <path d="M156 70 L206 66" stroke="#b4d2cc" stroke-width="3" opacity=".35"/>
  <path d="M230 66 L270 87" stroke="#b4d2cc" stroke-width="3" opacity=".22"/>

  <!-- door seam -->
  <path d="M219 97 L218 166" stroke="#252b2b" stroke-width="4"/>
  <path d="M313 99 L306 165" stroke="#252b2b" stroke-width="4"/>
  <rect x="242" y="113" width="31" height="7" rx="3" fill="#151c1d"/>

  <!-- salvaged replacement plate -->
  <path d="M234 127 L314 122 L322 159 L242 164 Z"
        fill="url(#repair)" stroke="#161d1f" stroke-width="5"/>
  <circle cx="248" cy="137" r="4" fill="#0e1517"/>
  <circle cx="307" cy="133" r="4" fill="#0e1517"/>
  <circle cx="253" cy="155" r="4" fill="#0e1517"/>
  <circle cx="313" cy="151" r="4" fill="#0e1517"/>

  <!-- Fort Knocks twin slash -->
  <path d="M266 153 L285 131" stroke="#e7ad3c" stroke-width="8" stroke-linecap="round"/>
  <path d="M288 152 L307 130" stroke="#b65c36" stroke-width="8" stroke-linecap="round"/>

  <!-- body highlight / wear -->
  <path d="M91 117 C176 100 339 104 416 118" stroke="url(#highlight)" stroke-width="6" fill="none"/>
  <path d="M97 146 L169 139" stroke="#c98a60" stroke-width="3" opacity=".45"/>
  <path d="M351 130 L408 137" stroke="#c98a60" stroke-width="3" opacity=".38"/>

  <!-- rust blooms and scratches -->
  <path d="M110 155 C122 144 136 146 148 157" stroke="#b65c36" stroke-width="5" opacity=".72" fill="none"/>
  <path d="M360 110 L386 101 M368 115 L399 108 M87 131 L104 124" stroke="#d08a57" stroke-width="3" opacity=".65"/>
  <path d="M178 110 L167 135 M188 112 L176 143 M334 150 L357 137" stroke="#332720" stroke-width="3" opacity=".7"/>

  <!-- improvised roof tie-down / small cargo -->
  <path d="M176 55 L176 45 L244 44 L255 55" stroke="#1a2224" stroke-width="7" fill="none" stroke-linejoin="round"/>
  <rect x="188" y="35" width="47" height="13" rx="3" fill="#5f5746" stroke="#111719" stroke-width="4"/>
  <path d="M197 38 L226 46" stroke="#e7ad3c" stroke-width="3" opacity=".55"/>

  <!-- lamps -->
  <rect x="424" y="119" width="22" height="13" rx="3" fill="#d9c28a" stroke="#151b1c" stroke-width="4"/>
  <rect x="70" y="126" width="15" height="18" rx="3" fill="#a54836" stroke="#151b1c" stroke-width="4"/>

  <!-- wheels -->
  <g>
    <circle cx="139" cy="184" r="41" fill="#0a0e11" stroke="#161d21" stroke-width="5"/>
    <circle cx="139" cy="184" r="27" fill="#31383b" stroke="#0d1214" stroke-width="5"/>
    <circle cx="139" cy="184" r="12" fill="#8b8065" stroke="#171d1e" stroke-width="4"/>
    <path d="M139 160 V208 M115 184 H163 M122 167 L156 201 M156 167 L122 201" stroke="#596267" stroke-width="3" opacity=".75"/>
  </g>
  <g>
    <circle cx="376" cy="184" r="41" fill="#0a0e11" stroke="#161d21" stroke-width="5"/>
    <circle cx="376" cy="184" r="27" fill="#31383b" stroke="#0d1214" stroke-width="5"/>
    <circle cx="376" cy="184" r="12" fill="#8b8065" stroke="#171d1e" stroke-width="4"/>
    <path d="M376 160 V208 M352 184 H400 M359 167 L393 201 M393 167 L359 201" stroke="#596267" stroke-width="3" opacity=".75"/>
  </g>

  <!-- wheel-arch darkening -->
  <path d="M99 171 A42 42 0 0 1 179 171" fill="none" stroke="#101619" stroke-width="8"/>
  <path d="M336 171 A42 42 0 0 1 416 171" fill="none" stroke="#101619" stroke-width="8"/>

  <!-- lower grime -->
  <path d="M178 164 C226 174 299 171 334 163" stroke="#211f1c" stroke-width="8" opacity=".45"/>
  <path d="M80 161 L119 168 M401 159 L431 163" stroke="#2a2621" stroke-width="6" opacity=".5"/>

  <!-- reference-finish pilot: directional warm rim / cool occlusion / controlled chipped wear -->
  <path d="M112 106 C166 73 243 61 318 96" fill="none" stroke="#f3bb73" stroke-width="5" opacity=".32" stroke-linecap="round"/>
  <path d="M326 101 C372 104 411 111 441 129" fill="none" stroke="#f0a14a" stroke-width="4" opacity=".28" stroke-linecap="round"/>
  <path d="M76 157 C146 169 211 174 282 169 C350 164 397 157 436 151 L438 170 C344 187 170 188 76 172Z" fill="#18282b" opacity=".20"/>
  <path d="M146 92 L214 92 L205 78 L164 80Z" fill="#d9f0e9" opacity=".08"/>
  <path d="M226 90 L294 90 L273 76 L233 69Z" fill="#d9f0e9" opacity=".07"/>
  <g fill="none" stroke-linecap="round">
    <path d="M93 121 L111 116 M118 151 L132 148 M151 112 L164 109 M330 119 L344 116 M401 146 L416 142" stroke="#efbd83" stroke-width="2.4" opacity=".54"/>
    <path d="M102 160 L115 154 M184 161 L197 158 M333 158 L347 151 M374 113 L389 109" stroke="#5b3027" stroke-width="3.2" opacity=".66"/>
    <path d="M244 129 L252 126 M303 127 L313 123 M248 161 L258 158" stroke="#aeb9ae" stroke-width="2" opacity=".48"/>
  </g>
  <path d="M73 171 C112 181 166 184 201 181" fill="none" stroke="#0a1114" stroke-width="5" opacity=".72"/>
  <path d="M313 178 C354 182 405 179 439 169" fill="none" stroke="#0a1114" stroke-width="5" opacity=".72"/>
  <circle cx="437" cy="127" r="7" fill="#f5dba1" opacity=".18"/>

</svg>