<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#867660"/>
    <stop offset=".48" stop-color="#655e50"/>
    <stop offset="1" stop-color="#3e4741"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8fb1ad"/>
    <stop offset=".48" stop-color="#536e6f"/>
    <stop offset="1" stop-color="#263c41"/>
  </linearGradient>
  <linearGradient id="repair" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5f6962"/>
    <stop offset="1" stop-color="#303b38"/>
  </linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f1b46e" stop-opacity="0"/>
    <stop offset=".5" stop-color="#f1b46e" stop-opacity=".55"/>
    <stop offset="1" stop-color="#f1b46e" stop-opacity="0"/>
  </linearGradient>
</defs>

<ellipse cx="300" cy="236" rx="250" ry="19" fill="#070b0e" opacity=".62"/>

<!-- heavy estate underbody / bumpers -->
<path d="M42 171 L73 151 L126 144 L172 102 L188 70 L388 66 L452 101 L520 131 L562 156 L555 203 L49 203Z"
