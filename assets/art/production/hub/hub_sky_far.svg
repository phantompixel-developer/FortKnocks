<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#31536b"/>
    <stop offset=".27" stop-color="#516b78"/>
    <stop offset=".48" stop-color="#a16557"/>
    <stop offset=".66" stop-color="#df7c45"/>
    <stop offset="1" stop-color="#3a302d"/>
  </linearGradient>
  <radialGradient id="sun" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff0b6"/>
    <stop offset=".38" stop-color="#ffd178" stop-opacity=".95"/>
    <stop offset=".7" stop-color="#ed9951" stop-opacity=".46"/>
    <stop offset="1" stop-color="#e77b43" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="haze" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f4bc83" stop-opacity=".04"/>
    <stop offset=".5" stop-color="#ffd7aa" stop-opacity=".24"/>
    <stop offset="1" stop-color="#ef9053" stop-opacity=".04"/>
  </linearGradient>
</defs>
<rect width="720" height="1280" fill="url(#sky)"/>
<circle cx="586" cy="232" r="142" fill="url(#sun)"/>
<circle cx="586" cy="232" r="39" fill="#ffdfa0" opacity=".92"/>
