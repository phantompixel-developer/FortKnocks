<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
<defs>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#52616a"/>
    <stop offset="1" stop-color="#26353b"/>
  </linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#765c48"/>
    <stop offset=".55" stop-color="#4d5552"/>
    <stop offset="1" stop-color="#303b3b"/>
  </linearGradient>
  <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffd080" stop-opacity=".75"/>
    <stop offset=".45" stop-color="#ed994c" stop-opacity=".22"/>
    <stop offset="1" stop-color="#ed994c" stop-opacity="0"/>
  </radialGradient>
</defs>

