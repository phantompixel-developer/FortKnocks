<rect x="12" y="104" width="524" height="16" rx="8" fill="#000" fill-opacity=".14"/>
<circle cx="24" cy="22" r="3" fill="#fff" fill-opacity=".35"/><circle cx="524" cy="22" r="3" fill="#fff" fill-opacity=".35"/></g>
